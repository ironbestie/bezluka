{% extends 'base.html' %}

{% block title %}Добавить ресторан{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 pb-8">
    <!-- Шапка -->
    <div class="bg-white shadow-sm p-4 flex items-center sticky top-0 z-10">
        <a href="{% url 'core:owner_restaurants' %}" class="text-gray-600 mr-4 text-2xl leading-none">←</a>
        <h1 class="text-lg font-bold text-gray-900 flex-1">Новый ресторан</h1>
    </div>
    
    <!-- Уведомления -->
    {% if messages %}
    <div class="p-4">
        {% for message in messages %}
        <div class="bg-red-100 text-red-700 p-3 rounded-lg text-sm">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    
    <!-- Форма -->
    <form method="post" class="p-4 space-y-4">
        {% csrf_token %}
        
        <!-- Название -->
        <div class="bg-white rounded-2xl p-5">
            <label class="block text-sm font-semibold text-gray-900 mb-2">Название ресторана *</label>
            <input type="text" name="name" required
                   placeholder="Например: White Rabbit"
                   class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none">
        </div>
        
        <!-- Город и адрес -->
        <div class="bg-white rounded-2xl p-5 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-900 mb-2">Город *</label>
                <input type="text" name="city" required
                       placeholder="Москва"
                       class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-900 mb-2">Адрес *</label>
                <input type="text" name="address" required
                       placeholder="ул. Тверская, д. 1"
                       class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none">
            </div>
        </div>
        
        <!-- Кухня и чек -->
        <div class="bg-white rounded-2xl p-5 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-900 mb-2">Тип кухни *</label>
                <input type="text" name="cuisine_type" required
                       placeholder="Итальянская, Европейская"
                       class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-900 mb-2">Средний чек (₽)</label>
                <input type="number" name="avg_check" value="2000" min="0"
                       class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none">
            </div>
        </div>
        
        <!-- Телефон и график -->
        <div class="bg-white rounded-2xl p-5 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-900 mb-2">Телефон *</label>
                <input type="tel" name="phone" required
                       placeholder="+7 (495) 123-45-67"
                       class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-900 mb-2">График работы</label>
                <input type="text" name="working_hours" value="10:00 - 00:00"
                       class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none">
            </div>
        </div>
        
        <!-- Описание -->
        <div class="bg-white rounded-2xl p-5">
            <label class="block text-sm font-semibold text-gray-900 mb-2">Описание</label>
            <textarea name="description" rows="4"
                      placeholder="Расскажите о вашем ресторане..."
                      class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none resize-none"></textarea>
        </div>
        
        <!-- Кнопка -->
        <button type="submit"
                class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-4 rounded-xl font-bold text-lg hover:opacity-90 transition shadow-lg">
            Создать ресторан
        </button>
        
        <p class="text-xs text-gray-500 text-center pb-4">
            После создания вы сможете настроить меню, персонал и интеграции
        </p>
    </form>
</div>
{% endblock %}
